site_name: BaleNova
site_description: مستندات کتابخانهٔ غیررسمی حساب بله برای Python
site_url: https://iliasync.github.io/balenova/
repo_url: https://github.com/iliasync/balenova
repo_name: iliasync/balenova
docs_dir: docs

theme:
  name: material
  language: fa
  direction: rtl
  palette:
    # پالت تاریک (پیش‌فرض جذاب‌تر و مدرن‌تر)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light-blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: تغییر به حالت روشن (Light Mode)
    # پالت روشن
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light-blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: تغییر به حالت تاریک (Dark Mode)
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/custom.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - شروع کار:
    - معرفی و معماری: index.md
    - نصب و احراز هویت: installation.md
    - ساخت ربات و سیستم رویدادها: bot_development.md
    - ماشین وضعیت و فرم‌ها (FSM): fsm.md
    - مدیریت خطاها و استثناها: errors.md
  - انواع داده و مدل‌ها:
    - کاتالوگ مدل‌ها و کلاس‌های داده: types.md
    - کیبوردها و تعاملات دکمه‌ای: keyboards.md
  - مرجع متدها (به سبک تلگرام):
    - پیام‌ها و رسانه‌ها: methods_messages.md
    - گفت‌وگوها، گروه‌ها و کانال‌ها: methods_chats.md
    - کاربران و مخاطبین: methods_users.md
    - امور بانکی، کیف پول و پاکت هدیه: methods_wallet.md
    - استوری، نظرسنجی و زمان‌بندی: methods_stories_polls.md
    - تماس‌های صوتی و تصویری (WebRTC): methods_calls.md
    - امنیت، نشست‌ها و حریم خصوصی: methods_settings.md
  - سناریوهای عملی و پروژه‌ها:
    - کوک‌بوک و کدهای آماده ربات: cookbook.md
    - پرسش‌های متداول (FAQ): faq.md
  - پروتکل و زیرساخت (پیشرفته):
    - ممیزی پروتکل وب: WEB_PROTOCOL_AUDIT.md
    - پروتکل تماس لایوکیت: CALL_RTC_PROTOCOL.md
    - مرجع ۶۹۰ متد پروتکل: all_methods_guide.md
    - مرجع کامل RPCها: rpc-reference.md
    - ۸۰ RPC بازیابی‌شده: recovered-rpcs.md
    - کاتالوگ متدهای پایتونیک: pythonic_rpc_methods.md
  - آرشیو یادداشت‌های فنی:
    - راهنمای شروع سریع پیشین: USAGE.md
    - رابط کاربری سطح پایین API: api.md
    - یادداشت‌های پیام‌رسانی: messaging.md
    - مدیریت پیشین گروه‌ها: group_management.md
    - امور بانکی و مینی‌اپ‌ها (نسخه ۱): banking_miniapps.md
    - کیبوردهای FSM پیشین: fsm_keyboards.md
    - استوری و نظرسنجی (نسخه ۱): stories_polls_schedule.md

extra:
  generator: false
