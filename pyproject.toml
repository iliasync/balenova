[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bale-session"
version = "0.2.0"
description = "A typed, asynchronous account-session client for Bale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bale Session contributors" }]
keywords = ["bale", "userbot", "asyncio", "websocket", "grpc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "protobuf>=7.35.1,<8",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.83,<2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-protobuf>=6.30",
]
research = ["playwright>=1.50,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/bale"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["src/bale/proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["bale"]
exclude = ["src/bale/proto/.*_pb2\\.py"]
