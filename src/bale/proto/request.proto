message GetUploadLimits {
}

message StartPhoneAuth {
  int64 phone_number = 1;
  int32 app_id = 2;
  string api_key = 3;
  string device_hash = 4;
  string device_title = 5;
  int32 send_code_type = 9;
  bytes options = 10;
}

message ValidateCode {
  string transaction_hash = 1;
  string code = 2;
  struct.BoolValue is_jwt = 3;
}

message ValidatePassword {
  string transaction_hash = 1;
  string password = 2;
  struct.BoolValue is_jwt = 3;
}

message SignUp {
  string transaction_hash = 1;
  string name = 2;
  int32 sex = 3;
  struct.StringValue password = 4;
}

message TerminateAllSessions {
}

message GetJWTToken {
}

message GetAuthSessions {
}

message TerminateSession {
  int32 uid = 1;
  struct.ExInfo ex_info = 2;
}

message SignOut {
}

message SendGiftPacketWithWallet {
  struct.Peer peer = 1;
  int64 random_id = 2;
  struct.GiftPacket gift = 3;
  string token = 4;
}

message OpenGiftPacket {
  struct.InfoMessage message = 1;
  string receiver_token = 2;
  bytes page_no = 3;
  int32 order_type = 4;
