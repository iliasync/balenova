syntax = "proto3";

package response;

import "struct.proto";
import "request.proto";

message Response {
  WsResponse ws_response = 1;
  WsUpdate ws_update = 2;
}

message WsResponse {
  WsError error = 1;
  bytes response = 2;
  int64 index = 3;
}

message WsError {
  int32 code = 1;
  string message = 2;
  struct.MapValue details = 3;
}

message WsUpdate {
  Update update = 1;
}

message Update {
  ComposedUpdate composed_update = 1;
}

message ComposedUpdate {
  MessageSent message_sent = 4;
  MessageRead message_read = 19;
  ThreadDeleteMessage message_delete = 46;
  MessageReadByMe message_read_by_me = 50;
  MessageReceived message_received = 54;
  UpdateMessage message = 55;
  EmptyUpdate empty_update = 85;
  ThreadEditMessage message_content_changed = 162;
  MessageDateChanged message_date_changed = 163;
  MessageQuotedChanged message_quoted_changed = 169;
  MessageReaction reactions_update = 222;
  CallStarted call_started = 52807;
  CallAccepted call_accepted = 52808;
  CallDiscarded call_discarded = 52809;
  CallReceived call_received = 52810;
  GroupCallStarted group_call_started = 52811;
  GroupCallEnded group_call_ended = 52812;
  CallReactionSent call_reaction_sent = 52813;
  CallLinkGenerated call_link_generated = 52826;
  CallJoinRequestReceived call_join_request_received = 52827;
  CallJoinRequestAnswered call_join_request_answered = 52828;
  MessageReaction message_reactions = 52825;
  MessageNewReaction message_new_reaction = 54323;
  CallEvent call_event = 54324;
}

message EmptyUpdate {}

message MessageSent {
  struct.Peer peer = 1;
  int64 rid = 2;
  int64 date = 3;
  struct.MessageId previous_message_id = 4;
}

message MessageRead {
  struct.Peer peer = 1;
  int64 start_date = 2;
  int64 read_date = 3;
}

message MessageReadByMe {
  struct.Peer peer = 1;
  int64 start_date = 2;
  struct.Int32Value unread_counter = 3;
  struct.Int64Value end_date = 4;
}

message MessageReceived {
  struct.Peer peer = 1;
  int64 start_date = 2;
  int64 received_date = 3;
}

message ThreadDeleteMessage {
  struct.Peer peer = 1;
  repeated int64 rids = 2;
  struct.DeleteDates dates = 3;
  repeated struct.MessageId thread_ids = 4;
  repeated struct.Int32Value quoted_comment_reply_sender_ids = 5;
}

message ThreadEditMessage {
  struct.Peer peer = 1;
  int64 rid = 2;
  struct.Message message = 3;
  struct.Int64Value date = 4;
  struct.Int32Value updater_user_id = 5;
  struct.MessageId thread_id = 6;
  struct.Int32Value quoted_comment_reply_sender_id = 7;
  struct.Message updated_content_type_message = 8;
  struct.ExPeer ex_peer = 9;
}

message MessageDateChanged {
  struct.Peer peer = 1;
  int64 rid = 2;
  int64 date = 3;
}

message MessageQuotedChanged {
  struct.Peer peer = 1;
  int64 rid = 2;
  struct.QuotedMessage quoted_message = 3;
}

message MessageReaction {
  struct.Peer peer = 1;
  int64 rid = 2;
  repeated struct.Reaction reactions = 3;
  int64 date = 4;
}

message MessageNewReaction {
  struct.ExPeer ex_peer = 1;
  struct.MessageId message_id = 2;
}

message CallStarted {
  struct.Call call = 1;
  repeated struct.Peer participants = 2;
}

message CallAccepted {
  struct.Call call = 1;
  repeated struct.Peer participants = 2;
}

message CallDiscarded {
  struct.Call call = 1;
  repeated struct.Peer participants = 2;
}

message CallReceived {
  int64 call_id = 1;
  repeated struct.Peer participants = 2;
}

message GroupCallStarted {
  struct.GroupCall group_call = 1;
