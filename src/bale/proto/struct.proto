syntax = "proto3";

package struct;

message Peer {
  int32 type = 1;
  int64 id = 2;
}

message ExPeer {
  int32 type = 1;
  int64 id = 2;
  int64 access_hash = 3;
}

message FastThumb {
  int32 w = 1;
  int32 h = 2;
  bytes thumb = 3;
}

message DocumentExPhoto {
  int32 w = 1;
  int32 h = 2;
}

message DocumentExVideo {
  int32 w = 1;
  int32 h = 2;
  int32 duration = 3;
}

message DocumentExVoice {
  int32 duration = 1;
  StringValue transcript = 2;
}

message DocumentExGif {
  int32 w = 1;
  int32 h = 2;
  int32 duration = 3;
}

message DocumentExAudio {
  int32 duration = 1;
  string album = 2;
  string artist = 3;
  string genre = 4;
  string track = 5;
  BytesValue cover = 6;
}

message DocumentEx {
  DocumentExPhoto document_ex_photo = 1;
  DocumentExVideo document_ex_video = 2;
  DocumentExVoice document_ex_voice = 3;
  DocumentExGif document_ex_gif = 4;
  DocumentExAudio document_ex_audio = 5;
}

message DocumentMessage {
  int64 file_id = 1;
  int64 access_hash = 2;
  int32 file_size = 3;
  string name = 4;
  string mime_type = 5;
  FastThumb thumb = 6;
  DocumentEx ext = 7;
  TextMessage caption = 8;
}

message TextMessage {
  string text = 1;
  repeated int64 mentions = 2;
}

message JsonMessage {
  string raw_json = 1;
}

message ImageLocation {
  FileLocation file_location = 1;
  int32 width = 2;
  int32 height = 3;
  int32 file_size = 4;
}

message StickerMessage {
  Int32Value sticker_id = 1;
  BytesValue fast_preview = 2;
  ImageLocation image512 = 3;
  ImageLocation image256 = 4;
  Int32Value sticker_collection_id = 5;
  Int64Value sticker_collection_access_hash = 6;
}

message Message {
  DocumentMessage document_message = 4;
  JsonMessage json_message = 7;
  StickerMessage sticker_message = 12;
  TextMessage text_message = 15;
  GiftPacket gift = 17;
}

message DeleteDates {
  repeated int64 dates = 1;
}

message MessageId {
  int64 date = 1;
  int64 rid = 2;
  int64 seq = 3;
}

message Reaction {
  repeated int64 users = 1;
  string emojy = 2;
  Int32Value count = 3;
}

// Shapes used by the current official web client's bulk reaction/view RPCs.
message BulkReaction {
  repeated int32 users = 1;
  string code = 2;
  Int64Value cardinality = 3;
  map<string, RawValue> ext = 4;
}

message MessageReactionsContainer {
  int64 rid = 1;
  int64 date = 2;
  repeated BulkReaction reactions = 3;
}

message MessageViewsContainer {
  MessageId message_id = 1;
  Int64Value views = 2;
}

message IntroPhoto {
  FastThumb thumb = 1;
  int32 width = 2;
  int32 height = 3;
}

message IntroGif {
  FastThumb thumb = 1;
  int32 width = 2;
  int32 height = 3;
}

message MediaExt {
  oneof trait {
    IntroGif intro_gif = 1;
    IntroPhoto intro_photo = 2;
  }
}

message IntroMedia {
  FileLocation file_location = 1;
  int32 file_size = 2;
  string mime_type = 3;
  string file_name = 4;
  MediaExt media_extra = 5;
}

message IntroMessage {
  StringValue text = 1;
  IntroMedia media = 2;
}

message Intro {
  StringValue text = 1;
  FileLocation file_location = 2;
  int32 width = 3;
  int32 height = 4;
  int32 file_size = 5;
  string mime_type = 6;
  string file_name = 7;
  FastThumb thumb = 8;
}

message BotExInfo {
  StringValue bot_active_users = 1;
  BoolValue has_main_mini_app = 2;
  Intro intro = 3;
  IntroMessage intro_message = 4;
  BoolValue has_timche_profile = 5;
  bool has_multiple_topics = 6;
  bool allow_topic_creation = 7;
}

enum ExPeerType {
  EX_PEER_TYPE_UNKNOWN = 0;
  EX_PEER_TYPE_PRIVATE = 1;
  EX_PEER_TYPE_GROUP = 2;
  EX_PEER_TYPE_CHANNEL = 3;
  EX_PEER_TYPE_BOT = 4;
  EX_PEER_TYPE_SUPERGROUP = 5;
  EX_PEER_TYPE_THREAD = 6;
}

message ExInfo {
  ExPeerType ex_peer_type = 1;
  BoolValue identified = 2;
}

enum PrivacyMode {
  PRIVACY_MODE_UNKNOWN = 0;
  PRIVACY_MODE_NONE = 1;
  PRIVACY_MODE_SPAM = 2;
}

message Int64Value {
  int64 value = 1;
}

message BoolValue {
  bool value = 1;
}

message FileLocation {
  uint64 file_id = 1;
  int64 access_hash = 2;
  Int32Value file_storage_version = 3;
}

message AvatarImage {
  FileLocation file_location = 1;
  int32 width = 2;
  int32 height = 3;
  int32 file_size = 4;
}

message Avatar {
  AvatarImage small_image = 1;
  AvatarImage large_image = 2;
  AvatarImage full_image = 3;
  Int64Value id = 4;
  Int64Value date = 5;
}

enum Sex {
  SEX_UNKNOWN = 0;
  SEX_MALE = 1;
  SEX_FEMALE = 2;
}

message StringValue {
  string value = 1;
}

message ExtKeyValue {
  string key = 1;
  string value = 2;
}

message PendingCallRequest {
  string requester_identifier = 1;
  string name = 2;
}

enum CallMode {
  CALL_MODE_UNKNOWN = 0;
  CALL_MODE_PRIVATE = 1;
  CALL_MODE_GROUP = 2;
  CALL_MODE_MULTI_PEER = 3;
  CALL_MODE_CHANNEL_LIVE = 4;
}

message GroupCall {
  int64 id = 1;
  string room = 2;
  string token = 3;
  StringValue url = 4;
  bool video = 5;
  Int64Value create_date = 6;
  Int32Value duration = 7;
  int32 initiator_user_id = 8;
  Peer peer = 9;
  map<string, RawValue> ext = 10;
  CallMode mode = 11;
  string link = 12;
  bool is_public = 13;
  map<string, string> extra = 15;
  string title = 16;
  repeated Peer in_call_participants = 17;
  Int64Value end_date = 18;
  repeated PendingCallRequest pending_requests = 19;
  repeated string raised_hands_user_identities = 20;
}

message PrivateCallLog {
  int32 status = 1;
}

message GroupCallLog {
  int32 status = 1;
  BoolValue missed = 2;
  repeated Peer peers = 3;
}

message MultiPeerCallLog {
  int32 status = 1;
  bool missed = 2;
  repeated Peer peers = 3;
}

message CallLog {
  Peer initiator = 1;
  Peer peer = 2;
  Peer finisher = 3;
  int64 duration = 4;
  int64 start_date = 5;
  map<string, string> extra = 6;
  PrivateCallLog private_call_log = 7;
  GroupCallLog group_call_log = 8;
  map<string, RawValue> ext = 9;
  Int64Value call_id = 10;
  MultiPeerCallLog multi_peer_call_log = 11;
  string title = 12;
  string link = 13;
  bool is_public = 14;
  int64 end_date = 15;
  int64 creation_date = 16;
}

message CallPeerState {
  int32 id = 1;
  int64 date = 2;
  int32 state = 3;
  map<string, RawValue> extra = 4;
}

message BytesValue {
  string Value = 1;
}

message DoubleValue {
  double value = 1;
}

message ArrayValue {
  repeated bytes array = 1;
}

message RawValue {
  StringValue string_value = 1;
  BoolValue boolean_value = 2;
  Int32Value int32_value = 3;
  Int64Value int64_value = 4;
  DoubleValue double_value = 5;
  ArrayValue array_value = 6;
}

message MapValueItem {
  string key = 1;
  RawValue value = 2;
}

message MapValue {
  repeated MapValueItem items = 1;
}

message User {
  int32 id = 1;
  int64 access_hash = 2;
  string name = 3;
  StringValue local_name = 4;
  Sex sex = 5;
  Avatar avatar = 6;
  BoolValue is_bot = 7;
  StringValue nick = 9;
  map<string, RawValue> ext = 14;
  Int64Value state_version = 15;
  BoolValue is_deleted = 16;
  repeated ContactInfo contact_info = 17;
  int32 puppeteer = 18;
  Int64Value created_at = 19;
  ExInfo ex_info = 20;
  BotExInfo bot_ex_info = 21;
}

message ContactInfo {
  int32 type = 1;
  StringValue string_value = 2;
  Int64Value long_value = 3;
  StringValue title = 4;
  StringValue subtitle = 5;
  StringValue type_spec = 6;
}

message FullUser {
  int32 id = 1;
  repeated ContactInfo contact_info = 2;
  StringValue about = 3;
  repeated string preferred_languages = 4;
  StringValue time_zone = 5;
  repeated BotCommand bot_commands = 6;
  map<string, RawValue> ext = 7;
  BoolValue is_blocked = 8;
  ExInfo ex_info = 9;
  StringValue default_bank_account = 10;
  StringValue default_card_number = 11;
  BoolValue is_deleted = 12;
  BoolValue is_contact = 13;
  int32 puppeteer = 14;
  Int64Value created_at = 15;
  PrivacyMode privacy_bar_mode = 16;
  BoolValue privacy_allowed_to_invite = 17;
}

// Combined profile returned by Users/GetFullUser in the current Web client.
// This is distinct from FullUser above, which is returned by LoadFullUsers.
message BotCommand {
  string slash_command = 1;
  string description = 2;
  StringValue loc_key = 3;
}

message UserProfile {
  int32 id = 1;
  int64 access_hash = 2;
  string name = 3;
  StringValue local_name = 4;
  StringValue nick = 5;
  Avatar avatar = 6;
  StringValue about = 7;
  repeated ContactInfo contact_info = 8;
  BoolValue is_bot = 9;
  Sex sex = 10;
  ExInfo ex_info = 11;
  repeated BotCommand bot_commands = 12;
  BoolValue is_blocked = 13;
  BoolValue is_deleted = 14;
  BoolValue is_contact = 15;
  map<string, RawValue> ext = 16;
  repeated string preferred_languages = 17;
  StringValue time_zone = 18;
  StringValue default_bank_account = 19;
  StringValue default_card_number = 20;
  int32 puppeteer = 21;
  Int64Value created_at = 22;
  PrivacyMode privacy_bar_mode = 23;
  BoolValue privacy_allowed_to_invite = 24;
  BotExInfo bot_ex_info = 25;
}

message FullPrivacy {
  int32 invite_privacy = 1;
  int32 presence_privacy = 2;
  int32 money_transfer_privacy = 3;
}

message OutPeer {
  int32 type = 1;
  int64 id = 2;
  int64 access_hash = 3;
}

message GroupOutPeer {
  int64 group_id = 1;
  int64 access_hash = 2;
}

message UserOutPeer {
  int32 uid = 1;
  int64 access_hash = 2;
}

message QuotedMessage {
  Int64Value message_id = 1;
  int32 sender_user_id = 3;
  int64 message_date = 4;
  Message quoted_message_content = 5;
  OutPeer quoted_peer = 6;
}

message MessageContainer {
  int32 sender_uid = 1;
  int64 rid = 2;
  int64 date = 3;
  Message message = 4;
  QuotedMessage quoted_message = 8;
}

message Group {
  int32 id = 1;
  string title = 3;
  int32 members_count = 20;
  repeated string available_reactions = 33;
}

enum Restriction {
  RESTRICTION_PRIVATE = 0;
  RESTRICTION_PUBLIC = 1;
}

message Int32Value {
  int32 value = 1;
}

enum GroupType {
  GROUP_TYPE_GROUP = 0;
  GROUP_TYPE_CHANNEL = 1;
  GROUP_TYPE_SUPER_GROUP = 2;
}

message FullGroup {
  int32 id = 1;
  string title = 3;
  Avatar avatar = 4;
  int32 owner_uid = 5;
  int64 create_date = 6;
  GroupType group_type = 7;
  BoolValue is_member = 8;
  Int32Value members_count = 10;
  StringValue nick = 11;
  Permissions permissions = 13;
  Permissions default_permissions = 14;
  StringValue theme = 15;
  StringValue about = 16;
  repeated Member members = 17;
  ExInfo ex_info = 18;
  MessageContainer pin = 19;
  Restriction restriction = 20;
  repeated string available_reactions = 24;
  BoolValue is_suspend = 25;
  Int32Value linked_group_peer_id = 26;
  BoolValue discussion_group_enabled = 27;
  PrivacyMode privacy_mode = 28;
}

message MessagesViews {
  MessageId mid = 1;
  repeated int64 views = 2;
}

message HistoryMessageIdentifier {
  Peer peer = 1;
  int64 random_id = 2;
  Int64Value date = 3;
}

message Permissions {
  bool see_message = 1;
  bool delete_message = 2;
  bool kick_user = 3;
  bool pin_message = 4;
  bool invite_user = 5;
  bool add_admin = 6;
  bool change_info = 7;
  bool send_message = 8;
  bool see_members = 9;
  bool edit_message = 10;
  bool send_media = 11;
  bool send_gif_stickers = 12;
  bool reply_to_story = 13;
  bool forward_message_from = 14;
  bool send_gift_packet = 15;
  bool start_call = 16;
  bool send_link_message = 17;
  bool send_forwarded_message = 18;
  bool add_story = 19;
  bool manage_call = 20;
}

message LoadMembersCondition {
  bool excepted_permissions = 1;
  bool contacts = 2;
  string query = 3;
}

message Member {
  int32 uid = 1;
  int32 inviter_uid = 2;
  int64 date = 3;
  BoolValue is_admin = 4;
  int32 promoter_user_id = 5;
  int64 promoted_at = 6;
  Permissions permissions = 7;
  string title = 8;
}

enum SendType {
  SEND_TYPE_UNKNOWN = 0;
  SEND_TYPE_PHOTO = 1;
  SEND_TYPE_VIDEO = 2;
  SEND_TYPE_VOICE = 3;
  SEND_TYPE_GIF = 4;
  SEND_TYPE_AUDIO = 5;
  SEND_TYPE_DOCUMENT = 6;
  SEND_TYPE_STICKER = 7;
  SEND_TYPE_CROWDFUNDING = 8;
  SEND_TYPE_SPONSORED = 9;
}

message SendTypeValue {
  SendType type = 1;
}

message Avatars {
  repeated Avatar avatars = 1;
}

enum TypingType {
  TYPING_TYPE_UNKNOWN = 0;
  TYPING_TYPE_TEXT = 1;
  TYPING_TYPE_VOICE_RECORDING = 2;
  TYPING_TYPE_SENDING_VOICE = 3;
  TYPING_TYPE_SENDING_FILE = 4;
  TYPING_TYPE_SENDING_PHOTO = 5;
  TYPING_TYPE_SENDING_VIDEO = 6;
  TYPING_TYPE_SENDING_MUSIC = 7;
  TYPING_TYPE_CHOOSING_STICKER = 8;
  TYPING_TYPE_CHOOSING_GIF = 9;
  TYPING_TYPE_CREATING_GIFT_PACKET = 10;
  TYPING_TYPE_SENDING_ALBUM = 11;
  TYPING_TYPE_CHOOSING_EMOJI = 12;
}

message FileUrlDescription {
  int64 file_id = 1;
  string url = 2;
  int32 timeout = 3;
  //repeated string unsigned_url_headers = 5;
  string unsigned_url = 6;
  Int32Value chunk_size = 7;
}

message SingleMedia {
  int64 random_id = 1;
  DocumentMessage media = 2;
}

message Dialog {
  Peer peer = 1;
  int32 unread_count = 2;
  int64 sort_date = 3;
  int32 sender_uid = 4;
  int64 rid = 5;
  int64 date = 6;
  Message message = 7;
  int32 state = 8;
  Int64Value first_unread_date = 9;
  ExInfo ex_info = 13;
  bool is_message_forwarded = 14;
  bool marked_as_unread = 17;
  bool is_mute = 18;
}

enum GivingType {
  GIVING_TYPE_SAME = 0;
  GIVING_TYPE_RANDOM = 1;
}

message GiftPacket {
  int32 count = 1;
  int64 total_amount = 2;
  GivingType giving_type = 3;
  StringValue token = 4;
  StringValue message = 5;
  int32 owner_id = 6;
  BoolValue show_amounts = 7;
}

message InfoMessage {
  Peer peer = 1;
  int64 message_id = 2;
  int64 date = 3;
}

message Winner {
  int32 id = 1;
  int64 amount = 2;
  int64 date = 3;
}

message Wallet {
  BoolValue is_merchant = 1;
  string app = 2;
  int64 balance = 3;
  string token = 4;
  int32 level = 5;
  StringValue pan = 6;
  StringValue account = 7;
}

enum ReportKind {
  REPORT_KIND_UNKNOWN = 0;
  REPORT_KIND_SCAM = 1;
  REPORT_KIND_INAPPROPRIATE_CONTENT = 2;
  REPORT_KIND_OTHER = 3;
  REPORT_KIND_VIOLENCE = 4;
  REPORT_KIND_SPAM = 5;
  REPORT_KIND_FALSE_INFORMATION = 6;
}

enum PeerSource {
  PEER_SOURCE_UNKNOWN = 0;
  PEER_SOURCE_DIALOGS = 1;
  PEER_SOURCE_VITRINE = 2;
  PEER_SOURCE_MARKET = 3;
  PEER_SOURCE_PRIVACY_BAR = 4;
}

message OtherMessage {
  int64 date = 1;
  int64 message_id = 2;
  Int64Value seq = 3;
}

message PeerReport {
  PeerSource source = 1;
  Peer peer = 2;
}

message MessageReport {
  Peer peer = 1;
  repeated OtherMessage messages = 2;
}

message Report {
  ReportKind kind = 1;
  string description = 2;
  PeerReport peer_report = 101;
  MessageReport message_report = 102;
}
