syntax = "proto3";

package struct;

message Peer {
  int32 type = 1;
  int64 id = 2;
}

message ExPeer {
  int32 type = 1;
  int64 id = 2;
  int64 access_hash = 3;
}

message FastThumb {
  int32 w = 1;
  int32 h = 2;
  bytes thumb = 3;
}

message DocumentExPhoto {
  int32 w = 1;
  int32 h = 2;
}

message DocumentExVideo {
  int32 w = 1;
  int32 h = 2;
  int32 duration = 3;
}

message DocumentExVoice {
  int32 duration = 1;
  StringValue transcript = 2;
}

message DocumentExGif {
  int32 w = 1;
  int32 h = 2;
  int32 duration = 3;
}

message DocumentExAudio {
  int32 duration = 1;
  string album = 2;
  string artist = 3;
  string genre = 4;
  string track = 5;
  BytesValue cover = 6;
}

message DocumentEx {
  DocumentExPhoto document_ex_photo = 1;
  DocumentExVideo document_ex_video = 2;
  DocumentExVoice document_ex_voice = 3;
  DocumentExGif document_ex_gif = 4;
  DocumentExAudio document_ex_audio = 5;
}

message DocumentMessage {
  int64 file_id = 1;
  int64 access_hash = 2;
  int32 file_size = 3;
  string name = 4;
  string mime_type = 5;
  FastThumb thumb = 6;
  DocumentEx ext = 7;
  TextMessage caption = 8;
}

message TextMessage {
  string text = 1;
  repeated int64 mentions = 2;
}

message JsonMessage {
  string raw_json = 1;
}

message ImageLocation {
  FileLocation file_location = 1;
  int32 width = 2;
  int32 height = 3;
  int32 file_size = 4;
}

message StickerMessage {
  Int32Value sticker_id = 1;
  BytesValue fast_preview = 2;
  ImageLocation image512 = 3;
  ImageLocation image256 = 4;
  Int32Value sticker_collection_id = 5;
  Int64Value sticker_collection_access_hash = 6;
}

message Message {
  DocumentMessage document_message = 4;
  JsonMessage json_message = 7;
  StickerMessage sticker_message = 12;
  TextMessage text_message = 15;
  GiftPacket gift = 17;
}

message DeleteDates {
  repeated int64 dates = 1;
}

message MessageId {
  int64 date = 1;
  int64 rid = 2;
  int64 seq = 3;
}

message Reaction {
  repeated int64 users = 1;
  string emojy = 2;
  Int32Value count = 3;
}

// Shapes used by the current official web client's bulk reaction/view RPCs.
message BulkReaction {
  repeated int32 users = 1;
  string code = 2;
  Int64Value cardinality = 3;
  map<string, RawValue> ext = 4;
}

message MessageReactionsContainer {
  int64 rid = 1;
  int64 date = 2;
  repeated BulkReaction reactions = 3;
}

message MessageViewsContainer {
  MessageId message_id = 1;
  Int64Value views = 2;
}

message IntroPhoto {
  FastThumb thumb = 1;
  int32 width = 2;
  int32 height = 3;
}

message IntroGif {
  FastThumb thumb = 1;
  int32 width = 2;
  int32 height = 3;
}

message MediaExt {
  oneof trait {
    IntroGif intro_gif = 1;
    IntroPhoto intro_photo = 2;
  }
}

message IntroMedia {
  FileLocation file_location = 1;
  int32 file_size = 2;
  string mime_type = 3;
  string file_name = 4;
  MediaExt media_extra = 5;
}

message IntroMessage {
  StringValue text = 1;
  IntroMedia media = 2;
}

message Intro {
  StringValue text = 1;
  FileLocation file_location = 2;
  int32 width = 3;
  int32 height = 4;
  int32 file_size = 5;
  string mime_type = 6;
  string file_name = 7;
  FastThumb thumb = 8;
}

message BotExInfo {
  StringValue bot_active_users = 1;
  BoolValue has_main_mini_app = 2;
  Intro intro = 3;
  IntroMessage intro_message = 4;
  BoolValue has_timche_profile = 5;
  bool has_multiple_topics = 6;
  bool allow_topic_creation = 7;
}

enum ExPeerType {
  EX_PEER_TYPE_UNKNOWN = 0;
  EX_PEER_TYPE_PRIVATE = 1;
  EX_PEER_TYPE_GROUP = 2;
  EX_PEER_TYPE_CHANNEL = 3;
  EX_PEER_TYPE_BOT = 4;
  EX_PEER_TYPE_SUPERGROUP = 5;
  EX_PEER_TYPE_THREAD = 6;
}

message ExInfo {
  ExPeerType ex_peer_type = 1;
  BoolValue identified = 2;
}

enum PrivacyMode {
  PRIVACY_MODE_UNKNOWN = 0;
  PRIVACY_MODE_NONE = 1;
  PRIVACY_MODE_SPAM = 2;
}

message Int64Value {
  int64 value = 1;
}

message BoolValue {
  bool value = 1;
}

message FileLocation {
  uint64 file_id = 1;
  int64 access_hash = 2;
  Int32Value file_storage_version = 3;
}

message AvatarImage {
  FileLocation file_location = 1;
  int32 width = 2;
  int32 height = 3;
  int32 file_size = 4;
}

message Avatar {
  AvatarImage small_image = 1;
  AvatarImage large_image = 2;
  AvatarImage full_image = 3;
  Int64Value id = 4;
  Int64Value date = 5;
}

enum Sex {
  SEX_UNKNOWN = 0;
  SEX_MALE = 1;
  SEX_FEMALE = 2;
}

message StringValue {
  string value = 1;
}

message ExtKeyValue {
  string key = 1;
  string value = 2;
}

message PendingCallRequest {
  string requester_identifier = 1;
  string name = 2;
}

enum CallMode {
  CALL_MODE_UNKNOWN = 0;
  CALL_MODE_PRIVATE = 1;
  CALL_MODE_GROUP = 2;
  CALL_MODE_MULTI_PEER = 3;
  CALL_MODE_CHANNEL_LIVE = 4;
}

message GroupCall {
  int64 id = 1;
  string room = 2;
  string token = 3;
  StringValue url = 4;
  bool video = 5;
  Int64Value create_date = 6;
  Int32Value duration = 7;
  int32 initiator_user_id = 8;
  Peer peer = 9;
  map<string, bytes> ext = 10;
  CallMode mode = 11;
  string link = 12;
  bool is_public = 13;
  map<string, bytes> extra = 15;
  string title = 16;
  repeated Peer in_call_participants = 17;
  Int64Value end_date = 18;
  repeated PendingCallRequest pending_requests = 19;
  repeated string raised_hands_user_identities = 20;
}

message PrivateCallLog {
  int32 status = 1;
}

message GroupCallLog {
  int32 status = 1;
  BoolValue missed = 2;
  repeated Peer peers = 3;
}

message MultiPeerCallLog {
  int32 status = 1;
  bool missed = 2;
  repeated Peer peers = 3;
}

message CallLog {
  Peer initiator = 1;
  Peer peer = 2;
  Peer finisher = 3;
  int64 duration = 4;
  int64 start_date = 5;
  map<string, bytes> extra = 6;
  PrivateCallLog private_call_log = 7;
  GroupCallLog group_call_log = 8;
  map<string, bytes> ext = 9;
  Int64Value call_id = 10;
  MultiPeerCallLog multi_peer_call_log = 11;
  string title = 12;
  string link = 13;
  bool is_public = 14;
  int64 end_date = 15;
  int64 creation_date = 16;
}

message Call {
  int64 id = 1;
  string token = 2;
  string room = 3;
  StringValue url = 4;
  bool video = 5;
  int64 create_date = 6;
  int64 start_date = 7;
  int32 admin_uid = 8;
  Peer peer = 9;
  int32 duration = 10;
  int32 discard_reason = 11;
  bool is_livekit = 12;
  Int64Value discard_service_message_rid = 13;
  Int64Value discard_service_message_date = 14;
  map<string, bytes> extra = 15;
  map<string, bytes> ext = 16;
}

message CallPeerState {
  int32 id = 1;
  int64 date = 2;
  int32 state = 3;
  map<string, RawValue> extra = 4;
}

message InternalCall {
  Peer peer = 1;
  int64 rid = 2;
  bool video = 3;
}

message LiveKitCall {
  Peer peer = 1;
  int64 rid = 2;
  bool video = 3;
  BoolValue invite_enable = 4;
}

message SipCall {
  int64 rid = 1;
  string caller_phone = 2;
  string callee_phone = 3;
  StringValue imei = 4;
  double lat = 5;
  double lon = 6;
}

message RaiseHand { string user_identity = 1; }
message LowerHand { string user_identity = 1; }

message BytesValue {
  string Value = 1;
}

message DoubleValue {
  double value = 1;
}

message ArrayValue {
  repeated RawValue array = 1;
}

message RawValue {
  string string_value = 1;
  bool boolean_value = 2;
  int32 int32_value = 3;
  int64 int64_value = 4;
  double double_value = 5;
  ArrayValue array_value = 6;
}

message MapValueItem {
  string key = 1;
  RawValue value = 2;
}

message MapValue {
  repeated MapValueItem items = 1;
}

message User {
  int32 id = 1;
  int64 access_hash = 2;
  string name = 3;
  StringValue local_name = 4;
  Sex sex = 5;
  Avatar avatar = 6;
  BoolValue is_bot = 7;
  StringValue nick = 9;
  map<string, RawValue> ext = 14;
  Int64Value state_version = 15;
  BoolValue is_deleted = 16;
  repeated ContactInfo contact_info = 17;
  int32 puppeteer = 18;
  Int64Value created_at = 19;
  ExInfo ex_info = 20;
  BotExInfo bot_ex_info = 21;
}

message ContactInfo {
  int32 type = 1;
  StringValue string_value = 2;
  Int64Value long_value = 3;
  StringValue title = 4;
  StringValue subtitle = 5;
  StringValue type_spec = 6;
}

message FullUser {
  int32 id = 1;
  repeated ContactInfo contact_info = 2;
  StringValue about = 3;
  repeated string preferred_languages = 4;
  StringValue time_zone = 5;
  repeated BotCommand bot_commands = 6;
  map<string, RawValue> ext = 7;
  BoolValue is_blocked = 8;
  ExInfo ex_info = 9;
  StringValue default_bank_account = 10;
  StringValue default_card_number = 11;
  BoolValue is_deleted = 12;
  BoolValue is_contact = 13;
  int32 puppeteer = 14;
  Int64Value created_at = 15;
  PrivacyMode privacy_bar_mode = 16;
  BoolValue privacy_allowed_to_invite = 17;
}

// Combined profile returned by Users/GetFullUser in the current Web client.
// This is distinct from FullUser above, which is returned by LoadFullUsers.
message BotCommand {
  string slash_command = 1;
  string description = 2;
  StringValue loc_key = 3;
}

message UserProfile {
  int32 id = 1;
  int64 access_hash = 2;
  string name = 3;
  StringValue local_name = 4;
  StringValue nick = 5;
  Avatar avatar = 6;
  StringValue about = 7;
  repeated ContactInfo contact_info = 8;
  BoolValue is_bot = 9;
  Sex sex = 10;
  ExInfo ex_info = 11;
  repeated BotCommand bot_commands = 12;
  BoolValue is_blocked = 13;
  BoolValue is_deleted = 14;
  BoolValue is_contact = 15;
  map<string, RawValue> ext = 16;
  repeated string preferred_languages = 17;
  StringValue time_zone = 18;
  StringValue default_bank_account = 19;
  StringValue default_card_number = 20;
  int32 puppeteer = 21;
  Int64Value created_at = 22;
  PrivacyMode privacy_bar_mode = 23;
  BoolValue privacy_allowed_to_invite = 24;
